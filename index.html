<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanoodle 3D Cinematic</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="starfield"></div>
    </div>

    <header>
        <h1>KANOODLE</h1>
        <p>Cosmic Puzzle</p>
        
        <div class="game-info">
            <div id="timer" class="timer">02:00</div>
            <button id="header-retry-btn" class="btn small-btn">Retry</button>
        </div>
    </header>

    <main>
        <div class="game-area">
            <div id="board-container">
                <!-- 5x11 grid generated by JS -->
            </div>
        </div>

        <div class="inventory-area">
            <div class="piece-controls hidden-controls" id="mobile-controls">
                <button id="btn-rotate" class="btn primary-btn small-btn">↻ Повернуть</button>
                <button id="btn-flip" class="btn primary-btn small-btn">↔ Отразить (Флип)</button>
            </div>
            
            <div id="pieces-container">
                <!-- Pieces generated by JS -->
            </div>
            
            <div class="controls">
                <button id="reset-btn" class="btn">Reset Board</button>
            </div>
        </div>
    </main>

    <div id="win-overlay" class="hidden">
        <div class="win-content">
            <h2>PUZZLE SOLVED!</h2>
            <p>You have mastered the cosmic grid.</p>
            <button id="next-level-btn" class="btn primary-btn">Play Again</button>
        </div>
    </div>

    <div id="game-over-overlay" class="hidden">
        <div class="win-content">
            <h2 class="game-over-text">TIME IS UP!</h2>
            <p>You ran out of time to solve the puzzle.</p>
            <div class="button-group">
                <button id="try-again-btn" class="btn primary-btn">Try Again</button>
                <button id="quit-btn" class="btn">Quit</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
