<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>O! Bank Tower Stack</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="game-root">
    <!-- Background and main layout -->
    <div class="game-background">
      <canvas id="game-canvas"></canvas>

      <!-- Top HUD -->
      <header class="hud">
        <div class="hud-logo">
          <span class="logo-mark">O!</span>
          <span class="logo-text">Bank</span>
        </div>
        <div class="hud-bonuses">
          <div class="hud-bonuses-label">O!-бонусы</div>
          <div class="hud-bonuses-value">
            <span id="hud-bonus-current">0</span>
            <span>/</span>
            <span id="hud-bonus-target">50</span>
          </div>
          <div class="hud-bonuses-icon coin-stack-icon"></div>
        </div>
      </header>

      <!-- Center score and instructions -->
      <main class="game-center">
        <div class="score-display" id="score-display">0</div>
        <div class="score-subtitle" id="score-subtitle">
          Нажмите, чтобы начать
        </div>
      </main>

      <!-- Base coin stack anchor (visual only, game uses canvas) -->
      <div class="coin-base-anchor">
        <div class="coin-base-shadow"></div>
        <div class="coin-base"></div>
      </div>

      <!-- Floating "arrow up" action button (visible on reward popup) -->
      <button class="floating-arrow-up" id="floating-arrow-up" aria-label="Наверх">
        ↑
      </button>

      <!-- White card modals container -->
      <div id="modal-root"></div>
    </div>
  </div>

  <!-- Game templates / popups -->
  <template id="tpl-welcome-modal">
    <div class="modal-overlay">
      <section class="modal-card">
        <header class="modal-header">
          <h1 class="modal-title">Стройте башню и получайте O!-бонусы!</h1>
        </header>
        <div class="modal-body">
          <div class="rule-row">
            <div class="rule-coin-icon coin-single-icon"></div>
            <div class="rule-text">
              <span class="rule-main">1 🪙 = 1 O!-бонус</span>
              <span class="rule-dot"></span>
            </div>
          </div>
          <p class="modal-description">
            Важно, чтобы монетки ровно ложились одна на другую. Играйте сколько
            угодно, забирайте выигрыш раз в день.
          </p>
        </div>
        <footer class="modal-footer">
          <button class="btn btn-primary" data-role="start-game">
            Играть
          </button>
        </footer>
      </section>
    </div>
  </template>

  <template id="tpl-game-over-modal">
    <div class="modal-overlay">
      <section class="modal-card modal-card--narrow">
        <header class="modal-header">
          <h1 class="modal-title">Ваш результат</h1>
        </header>
        <div class="modal-body modal-body--center">
          <div class="result-score" id="result-score-text">0</div>
          <div class="result-coin-stack-visual">
            <div class="stack-coin stack-coin--1"></div>
            <div class="stack-coin stack-coin--2"></div>
            <div class="stack-coin stack-coin--3"></div>
            <div class="stack-coin stack-coin--4"></div>
            <div class="stack-coin stack-coin--5"></div>
          </div>
        </div>
        <footer class="modal-footer modal-footer--column">
          <button class="btn btn-primary" data-role="claim-reward">
            Забрать <span data-bind="final-score">0</span> O!-бонусов
          </button>
          <button class="btn btn-secondary" data-role="play-again">
            Сыграть ещё
          </button>
          <div class="modal-hint" id="daily-limit-hint"></div>
        </footer>
      </section>
    </div>
  </template>

  <template id="tpl-reward-modal">
    <div class="modal-overlay">
      <section class="modal-card">
        <button class="modal-close" data-role="close-modal" aria-label="Закрыть">
          ✕
        </button>
        <header class="modal-header modal-header--center">
          <h1 class="modal-title">O!-бонусы ваши!</h1>
        </header>
        <div class="modal-body modal-body--center">
          <div class="reward-counter-circle">
            <span class="reward-counter-prefix">+</span>
            <span class="reward-counter-value" id="reward-counter-value">0</span>
            <span class="reward-counter-suffix">O!</span>
          </div>
          <div class="reward-coins-pile">
            <div class="coin-row coin-row--back">
              <span class="coin-pill"></span><span class="coin-pill"></span
              ><span class="coin-pill"></span>
            </div>
            <div class="coin-row coin-row--front">
              <span class="coin-pill"></span><span class="coin-pill"></span
              ><span class="coin-pill"></span>
            </div>
          </div>
          <p class="modal-description modal-description--narrow">
            Мы начислим их после проверки. Дальше можно играть просто так. Новые
            O!-бонусы будут доступны при следующем заходе завтра.
          </p>
        </div>
        <footer class="modal-footer">
          <button class="btn btn-primary" data-role="continue">
            Понятно
          </button>
        </footer>
      </section>
    </div>
  </template>

  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
